 const sh=[{name:'Nota',rows:nota,hdr:hd,w:[16,12,10,26,12,12,18,11,12,10]},{name:'Detail Item',rows:det,hdr:hd,w:[16,26,34,7,11,12]}];
 sh.push({name:'Pelunasan',rows:[['Tanggal','Jam','No Nota','Pengutang','Nominal','Metode','Catatan','Oleh']].concat(s.lunas.map(x=>[x.tgl,x.jam,x.no,x.nama,x.nom,x.metode,x.cat,x.oleh])),hdr:hd,w:[12,8,16,20,12,14,20,12]});
 sh.push({name:'Pembatalan',rows:[['Tanggal','Jam','Meja','Item','Qty','Harga','Alasan','Oleh']].concat(s.batal.map(x=>[x.tgl,x.jam,x.meja,x.item,x.qty,x.harga,x.alasan,x.oleh])),hdr:hd,w:[12,8,22,26,6,10,22,12]});
 if(s.biaya.length||judul==='penuh')sh.push({name:'Biaya',rows:[['Tanggal','Keterangan','Nominal','Jenis','Oleh']].concat(s.biaya.map(x=>[x.tgl,x.ket,x.nom,x.jenis,x.oleh])),hdr:hd,w:[12,30,12,14,12]});
 return xlsxBuild(sh)}
async function bkFolder(D,k){const S=bkSets(D),dir=BK.dir[k],w=async(nm,data)=>{const f=await dir.getFileHandle(nm,{create:true}),h=await f.createWritable();await h.write(data);await h.close()};
 await w('resto-'+k+'.json',JSON.stringify({dibuat:D.ts,jenis:k==='penuh'?'Data penuh':'Dine in + Bungkus saja',...S[k]}));await w('resto-'+k+'.xlsx',bkXlsx(S[k],k))}
async function bkPilih(k){if(!window.showDirectoryPicker)return alert('Browser ini belum mendukung penyimpanan ke folder. Gunakan Google Chrome atau Microsoft Edge di komputer.');
 try{const d=await showDirectoryPicker({mode:'readwrite',id:'restobk'+k});BK.dir[k]=d;await bkPut('dir_'+k,d);BK.perm[k]=true;await bkSync(false)}catch(e){if(e&&e.name!=='AbortError')alert('Gagal memilih folder: '+e.message)}bkUi()}
async function bkLepas(k){BK.dir[k]=null;BK.perm[k]=false;await bkPut('dir_'+k,null);bkUi()}
async function bkIzin(k){await bkPerm(k,true);if(BK.perm[k])bkSync(false);else bkUi()}
async function bkUnduh(k){const D=await bkLoad(),S=bkSets(D);try{dlBlob(bkXlsx(S[k],k),'resto-'+k+'-'+bkYmd(new Date())+'.xlsx')}catch(e){alert('Gagal: '+e.message)}}
async function bkUnduhJson(k){const D=await bkLoad(),S=bkSets(D);dlBlob(new Blob([JSON.stringify({dibuat:D.ts,...S[k]})],{type:'application/json'}),'resto-'+k+'-'+bkYmd(new Date())+'.json')}
async function bkBuka(){bkUi()}
async function bkUi(){const m=$('#bks');if(!m)return;const D=await bkLoad(),S=bkSets(D),fd=!!window.showDirectoryPicker;
 const fr=(k,jd,ket,n)=>`<div class="bzr"><div class="bzh"><span><b>${jd}</b><br><small>${ket}</small></span><b>${n} nota</b></div>
  <div class="bzf"><span>📁 ${BK.dir[k]?esc(BK.dir[k].name)+(BK.perm[k]?' ✔':' <i>(izin belum aktif)</i>'):'<i>folder belum dipilih</i>'}${BK.fst[k]?' · '+esc(BK.fst[k]):''}</span><span class="bzb">${fd?`<button type="button" class="g" onclick="bkPilih('${k}')">${BK.dir[k]?'Ganti':'Pilih'} folder</button>`:''}${BK.dir[k]&&!BK.perm[k]?`<button type="button" class="g" onclick="bkIzin('${k}')">🔓 Aktifkan izin</button>`:''}${BK.dir[k]?`<button type="button" class="g" onclick="bkLepas('${k}')" title="Lepas folder">✕</button>`:''}<button type="button" class="g" onclick="bkUnduh('${k}')">⬇ Excel</button><button type="button" class="g" onclick="bkUnduhJson('${k}')">⬇ JSON</button></span></div></div>`;
 m.innerHTML=`<small style="color:#555">Data utama ada di server. Komputer kasir menyimpan salinan otomatis (tiap ${BK_MS/60000} menit &amp; setelah pembayaran) di browser dan, bila dipilih, di folder. Pengaturan folder berlaku untuk komputer ini saja — buka Admin dari komputer kasir.</small>
 ${fr('penuh','Data penuh','semua nota, biaya, pelunasan, pembatalan',S.penuh.nota.length)}
 ${fr('terbatas','Data terbatas','hanya Dine in &amp; Bungkus (tanpa Online &amp; Konsumsi/Entertain, tanpa biaya)',S.terbatas.nota.length)}
 <div class="bzf"><span>Status: ${esc(BK.busy?'Menyalin...':BK.st||(D.ts?'Terakhir '+new Date(D.ts).toLocaleString('id-ID'):'Belum pernah disalin'))}</span><span class="bzb"><button type="button" onclick="bkSync(false)" ${BK.busy?'disabled':''}>🔄 Simpan sekarang</button><button type="button" class="g" onclick="if(confirm('Muat ulang semua data 2 tahun terakhir dari server? Bisa beberapa menit.'))bkSync(true)">♻ Muat ulang penuh</button></span></div>
 <small style="color:#777">File: resto-penuh.xlsx/.json di folder Data penuh, resto-terbatas.xlsx/.json di folder Data terbatas (ditimpa tiap simpan). Nota yang dihapus/diedit Super Admin lama tidak ikut berubah sampai "Muat ulang penuh".</small>`}

setInterval(()=>{if(mode==='kasir'&&U&&!adm&&!OFS.on)bkSync(false)},BK_MS);setTimeout(()=>{if(mode==='kasir'&&U)bkSync(false)},15000);
