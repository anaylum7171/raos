<!DOCTYPE html>

<style>

.tw{display:flex;flex-direction:column;align-items:center;width:50px}.tm2{height:12px;line-height:12px;font-size:10px;font-weight:700;color:#555;font-variant-numeric:tabular-nums;margin-top:2px}
.pill.o{background:#fff;color:#d98324;margin-left:6px}
.sec.cp{margin:8px 10px;padding:2px 10px 6px}.sec.cp h3{font-size:13px;margin:4px 0 0}.sec.cp .grid{padding:4px 0;gap:6px}

@keyframes p{0%,100%{box-shadow:0 0 0 0 #e74c3c88}50%{box-shadow:0 0 0 5px #e74c3c00}}
.sec{margin:14px;padding:6px 12px 14px;border-radius:16px;border:2px solid var(--c);border-left-width:10px;background:color-mix(in srgb,var(--c) 8%,#fff)}
.sec h3{margin:8px 0 0;color:var(--c)}.sec h3 small{color:#555;font-weight:400;margin-left:8px}.sec .grid{padding:6px 0}
.tabs{display:flex;gap:8px;padding:10px 14px}.tabs button{flex:1;background:#ddd;color:#222}.tabs .on{background:#2d6a4f;color:#fff}
.ar{padding:10px 14px 0}.ar button{padding:8px 4px;font-size:13px}
.item{display:flex;align-items:center;gap:10px;background:#fff;margin:8px 14px;padding:10px;border-radius:10px}
.item div:first-child{flex:1}.item small{color:#666}.q{display:flex;align-items:center;gap:8px}.q button{width:36px;padding:6px}

.fld{display:block;margin:10px 0 2px;font-size:13px;color:#555}.fld+input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit}
.pill{display:inline-block;background:#c0392b;color:#fff;border-radius:10px;padding:2px 9px;font-size:12px;font-weight:600}.pill.w{background:#fff;color:#c0392b;margin-left:6px}
.ok{color:#2d6a4f;font-size:12px;font-weight:600}
.ob{background:#fff;border-radius:10px;padding:8px 10px;margin:8px 0;box-shadow:0 1px 3px #0002}
.oh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.ck{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid #eee;cursor:pointer;border-radius:6px}.ck span{flex:1}.ck input{width:22px;height:22px}.ck.dn span{text-decoration:line-through;color:#999}
.sumb{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px 0}
.ck.y,tr.y{background:#fff3b0}.ck.rd,tr.rd{background:#ffc9d4}
.tm{font-variant-numeric:tabular-nums;font-weight:700;color:#555;white-space:nowrap}.y .tm{color:#8a6d00}.rd .tm{color:#b0002a}
.t.rsv{background:#cfe3ff;border-color:#3b82f6}.rvb{margin:8px 0;padding:8px;background:#eef5ff;border:1px solid #b6d0f5;border-radius:10px}.rvr{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed #b6d0f5;font-size:14px}.rvbt{display:flex;gap:4px;flex-shrink:0}.rvbt button{padding:4px 8px;width:auto;font-size:13px}.rvf label{display:block;font-size:13px;margin-top:6px;color:#444}.rvf input,.rvf select{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:8px;font:inherit}
.xb{background:#fbe3e3;color:#c0392b;border:1px solid #e8b4b4;border-radius:6px;padding:0 7px;font-size:13px;line-height:22px;width:auto;margin-left:4px}.cn{flex-basis:100%;width:100%;padding:7px 9px;border:1px solid #e0c060;border-radius:8px;background:#fffbe6;font:inherit;font-size:13px;margin:6px 0;box-sizing:border-box}
.vrw{flex-basis:100%;display:flex;flex-direction:column;gap:5px}.vr{display:flex;align-items:center;gap:6px;background:#fff7e0;border:1px solid #f0d890;border-radius:8px;padding:4px 6px}.vr input{flex:1;min-width:0;padding:6px 8px;border:1px solid #ddd;border-radius:6px;font:inherit;font-size:13px}.vr button{width:30px;padding:4px}.vr b{min-width:18px;text-align:center}.vadd{background:none;border:1px dashed #999;color:#444;font-size:12px;padding:4px 10px;border-radius:8px}
.item{flex-wrap:wrap}.item .nt{flex-basis:100%;padding:7px 9px;border:1px solid #ddd;border-radius:8px;font:inherit;font-size:13px;background:#fafafa}
.prev{background:#fff;border:1px dashed #999;border-radius:6px;padding:10px 12px;font:12px/1.4 monospace;color:#000;max-width:300px;margin:8px auto;max-height:55vh;overflow:auto}.prev hr{border:0;border-top:1px dashed #000}.prev .r{display:flex;justify-content:space-between}
.mdl{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.mbox{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:400px;max-height:94vh;overflow:auto}.mbox h2{margin:0 0 6px}
.mt{display:flex;gap:8px;margin:12px 0}.mt button{flex:1}.mt .g{background:#ddd}.mt .tg{background:#ddd;color:#222}.mt .on{background:#2d6a4f;color:#fff}
.mrow{display:flex;justify-content:space-between;align-items:center;margin:9px 0;font-size:16px}
.mbox input.by{width:170px;padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit;font-size:20px;text-align:right}
.qk{display:flex;gap:6px;margin:4px 0}.qk button{flex:1;background:#eee;color:#222;padding:8px 6px;font-size:14px}.qk .hp{background:#f3d6d2}
.qn{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}.qn button{background:#eee;color:#222;padding:9px 2px;font-size:14px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.mg button{background:#ddd;color:#222}.mg .on{background:#2d6a4f;color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px;margin:6px 0;font-size:14px}
.pl{border-top:1px dashed #bbb;margin-top:6px}.pl .mrow{margin:5px 0;font-size:15px}.sep{border-top:3px solid #2d6a4f;margin:12px 0 8px}
.mbox input.kt{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit;margin-top:4px}
.kb{font-size:22px;font-weight:700;color:#2d6a4f}.kb.neg{color:#c0392b}
@page{margin:0}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block;width:58mm;padding:3mm;font:12px monospace;color:#000}#pr hr{border:0;border-top:1px dashed #000}#pr .r{display:flex;justify-content:space-between}}
@media(max-width:800px){.kasir{grid-template-columns:1fr}.panel{position:static;height:auto}}
</style></head><body>
<div id="app"></div><div id="pr"></div>
<script>
/* ====== HUBUNGKAN GOOGLE SHEET: tempel URL Web App (berakhiran /exec) di antara tanda kutip, lalu simpan file ====== */
const SHEET_URL='https://script.google.com/macros/s/AKfycbzF9iE0FZZP4xA0C68nCSYfVtYKMrK6TsHPPq_EJQnDb1RI6rHJld_AZJQjbgcLs8nBrg/exec';
/* Kecepatan baca data (milidetik). Makin kecil makin cepat, tapi makin banyak permintaan ke Google. */
const POLL_KASIR=2000,POLL_HP=3000;
/* ====== DEFAULT (dipakai kalau Google Sheet masih kosong; selanjutnya diubah lewat tombol Admin) ====== */
const DEFMENU=[
 {id:1,nama:'Nasi Goreng',harga:25000,kat:'dapur'},{id:2,nama:'Mie Goreng',harga:23000,kat:'dapur'},
 {id:3,nama:'Ayam Bakar',harga:30000,kat:'dapur'},{id:4,nama:'Sate Ayam',harga:28000,kat:'dapur'},
 {id:5,nama:'Soto Ayam',harga:22000,kat:'dapur'},{id:6,nama:'Kentang Goreng',harga:15000,kat:'dapur'},
 {id:7,nama:'Es Teh',harga:6000,kat:'bar'},{id:8,nama:'Es Jeruk',harga:9000,kat:'bar'},
 {id:9,nama:'Kopi Hitam',harga:10000,kat:'bar'},{id:10,nama:'Kopi Susu',harga:15000,kat:'bar'},
 {id:11,nama:'Jus Alpukat',harga:16000,kat:'bar'},{id:12,nama:'Air Mineral',harga:5000,kat:'bar'},
 {id:13,nama:'Paket Hemat',harga:28000,kat:'paket',isi:[{id:1,qty:1},{id:7,qty:1}]}];
const DEFCFG={resto:'RESTO SAYA',alamat:'Jl. Contoh No. 1',pin:'1234'};
/* ========================================================================== */
const $=s=>document.querySelector(s),rp=n=>'Rp'+(+n).toLocaleString('id-ID'),esc=s=>String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;');
const AREAS=['Lantai 1','Lantai 2','Bungkus','Online'];
const COL={'Lantai 1':'#2d6a4f','Lantai 2':'#2471a3','Bungkus':'#d98324','Online':'#8e44ad'};
const DEF=[];
for(let n=1;n<=10;n++)DEF.push({id:''+n,area:'Lantai 1',nama:''+n});
for(let n=1;n<=10;n++)DEF.push({id:''+(n+10),area:'Lantai 2',nama:''+n});
for(let n=1;n<=5;n++)DEF.push({id:'B'+n,area:'Bungkus',nama:'Bungkus '+n});
['Shopee','GoFood','GrabFood','Lainnya'].forEach((x,i)=>DEF.push({id:'O'+(i+1),area:'Online',nama:x}));
let U=SHEET_URL.trim(),O={},M=DEF,MENU=DEFMENU.map(x=>({...x})),CFG={...DEFCFG},ar=AREAS[0],mode=location.hash.slice(1),sel=null,cart={},tab='dapur',notes={},vr={},RV=[],rf={},ST='',adm=false,vw='',atab='meja',MN=[];
const app=$('#app');
const subt=o=>o?Math.max(0,o.items.reduce((a,i)=>a+i.harga*i.qty,0)):0;
const dtAmt=(sub,dt)=>!dt?0:dt.t==='%'?Math.round(sub*Math.min(100,Math.max(0,+dt.v||0))/100):Math.min(sub,Math.max(0,+dt.v||0));
const dbase=o=>Math.max(0,subt(o)-o.items.reduce((a,i)=>a+(i.kat==='diskon'&&i.ex1?i.ex1*i.qty:0),0));
const dtd=o=>o&&o.dt?dtAmt(dbase(o),o.dt):0;
const tot=o=>o?subt(o)-dtd(o):0;
const bruto=o=>o.items.reduce((a,i)=>a+(i.harga*i.qty>0?i.harga*i.qty:0),0);
const act=i=>i.kat!=='paket'&&i.kat!=='diskon';
const baru=o=>o?o.items.filter(i=>act(i)&&i.qty>(i.p||0)).length:0;
const blm=o=>o?o.items.reduce((a,i)=>a+(act(i)?Math.max(0,i.qty-(i.d||0)):0),0):0;
const blmAll=()=>Object.values(O).reduce((a,o)=>a+blm(o),0);
const blmP=o=>o?o.items.reduce((a,i)=>a+(act(i)?Math.max(0,i.qty-(i.p||0)):0),0):0;
const blmPAll=()=>Object.values(O).reduce((a,o)=>a+blmP(o),0);
const t0o=(o,it)=>it.t||(o&&o.waktu)||'';
const fmtT=t=>{const ms=Date.now()-Date.parse(t);if(isNaN(ms))return '';const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const tmAt=(o,it,k)=>(it.ts&&it.ts[k])||t0o(o,it);
const clsT=t=>{const ms=Date.now()-Date.parse(t);return isNaN(ms)?'':ms>=900000?'rd':ms>=300000?'y':''};
const oldU=(o,it)=>{const a=dmOf(it);let m='';for(let k=0;k<it.qty;k++)if(!a[k]){const t=tmAt(o,it,k);if(t&&(!m||t<m))m=t}return m};
const tcls=(o,it)=>{if(!act(it))return '';const t=oldU(o,it);return t?clsT(t):''};
const dmOf=it=>Array.from({length:it.qty},(_,k)=>it.dm?!!it.dm[k]:k<(it.d||0));
const tcls1=(o,it,dn,k)=>dn?'':clsT(tmAt(o,it,k));
const tmr1=(o,it,dn,k)=>{if(dn)return '';const t=tmAt(o,it,k);return t?`<small class="tm" data-t="${t}">${fmtT(t)}</small>`:''};
const tmr=(o,it)=>{if(!act(it))return '';const t=oldU(o,it);return t?`<small class="tm" data-t="${t}">${fmtT(t)}</small>`:''};
function tick(){document.querySelectorAll('[data-t]').forEach(el=>{const ms=Date.now()-Date.parse(el.dataset.t);if(isNaN(ms))return;el.textContent=fmtT(el.dataset.t);const r=el.closest('.ck,tr');if(r){r.classList.toggle('y',ms>=300000&&ms<900000);r.classList.toggle('rd',ms>=900000)}})}
setInterval(tick,1000);
const ostart=o=>o?(o.waktu||o.items.map(i=>i.t).filter(Boolean).sort()[0]||''):'';
const otm=o=>{const t=ostart(o);return `<div class="tm2"${t?` data-t="${t}"`:''}>${t?fmtT(t):'&nbsp;'}</div>`};
const sk=n=>n>=1000?(Math.round(n/100)/10)+'k':n;
const cartN=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const lbl=id=>{const m=M.find(x=>x.id==id);return m?(m.area.startsWith('Lantai')?m.area+' · Meja '+m.nama:m.area=='Online'?'Online · '+m.nama:m.nama):'Meja '+id};
const rr0=()=>mode==='kasir'?kas():pel();
const rr=()=>mode==='kasir'?pnl():pel();
const J=(k,d)=>{try{return JSON.parse(localStorage[k])||d}catch(e){return d}};

async function load(force){const t0=Date.now(),w0=wv;try{
 if(U){const r=await(await fetch(U)).json();if(!force&&(wv!==w0||Date.now()-lw<2500))return;O=r.orders||{};M=r.meja&&r.meja.length?r.meja:DEF;MENU=r.menu&&r.menu.length?r.menu:DEFMENU.map(x=>({...x}));CFG={...DEFCFG,...(r.cfg||{})};RV=r.resv||[]}
 else{O=J('O',{});RV=J('RV',[]);M=J('M',DEF);MENU=J('MENU',DEFMENU.map(x=>({...x})));CFG={...DEFCFG,...J('CFG',{})}}
 ST=U?'● online '+((Date.now()-t0)/1000).toFixed(1)+'s':'● lokal (tes)'}catch(e){ST='⚠ gagal sambung ('+location.protocol+' · '+((e&&e.message)||e)+')'}
 $('#st')&&($('#st').textContent=ST)}
async function post(d,quiet){wv++;lw=Date.now();let r='';try{if(U){const x=await fetch(U,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(d)});r=await x.text()}else{localStorage.O=JSON.stringify(O);localStorage.M=JSON.stringify(M);localStorage.MENU=JSON.stringify(MENU);localStorage.CFG=JSON.stringify(CFG);localStorage.RV=JSON.stringify(RV)}}catch(e){r=null;if(!quiet)alert('Gagal simpan ke Google Sheet')}lw=Date.now();return r}
const head=t=>`<header><b>${t}</b><span><span id="st">${ST}</span> <button onclick="bukaAdmin()">🔧</button> <button onclick="location.hash='';location.reload()">Menu</button></span></header>`;

var busy=false,wv=0,lw=0;
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!adm&&(mode==='kasir'||(mode==='pelayan'&&sel==null)))load().then(rr0)});
function start(){
 document.body.classList.toggle('mk',mode==='kasir');
 if(mode!=='pelayan'&&mode!=='kasir'){app.innerHTML=`<div class="home"><h1>🍽 ${esc(CFG.resto)}</h1><button class="b" onclick="go('kasir')">🖥 Kasir (Desktop)</button><button onclick="go('pelayan')">📱 Pelayan (HP)</button><button class="g" onclick="bukaAdmin()">🔧 Admin</button></div>${U?'':'<p style="color:#c0392b;font-size:13px">⚠ URL Google Sheet belum diisi di file HTML. Data hanya tersimpan di perangkat ini (mode tes).</p>'}`;load().then(()=>{if(!adm&&mode!=='pelayan'&&mode!=='kasir')start2()});return}
 load().then(rr0);
 clearInterval(window.iv);window.iv=setInterval(async()=>{
  if(adm||document.hidden||busy)return;busy=true;
  try{if(mode==='kasir'){await load();kas(cartN()>0||document.activeElement.type==='text'||document.activeElement.type==='number')}
  else if(sel==null){await load();pel()}}finally{busy=false}},mode==='kasir'?POLL_KASIR:POLL_HP);
}
function start2(){const h=$('.home h1');if(h)h.textContent='🍽 '+CFG.resto}
function go(m){location.hash=m;mode=m;start()}

/* ===== MEJA (tampilan) ===== */
function tbl(m,k){const o=O[m.id],u=blm(o),rv=!o&&rvHariIni(m.id);
 return `<div class="tw"><div class="t ${o?'pakai':''} ${rv?'rsv':''} ${sel==m.id?'sel':''}" onclick="pilih('${m.id}')"><b style="font-size:${m.nama.length>3?9:14}px">${esc(m.nama)}</b><small>${o?(k?sk(tot(o)):'terisi'):rv?'📅'+rv.jam:'kosong'}</small>${blmP(o)?`<i>${blmP(o)}</i>`:''}${u?`<em>${u}</em>`:''}</div>${otm(o)}</div>`}
function pilih(id){sel=id;vw='';cart={};notes={};vr={};rr0()}
/* ===== RESERVASI ===== */
const hari=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const mnt=j=>{const p=String(j||'0:0').split(':');return (+p[0])*60+(+p[1]||0)};
const tglF=t=>{const p=t.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
const rvSort=(a,b)=>(a.tgl+a.jam).localeCompare(b.tgl+b.jam);
const rvMeja=id=>RV.filter(r=>r.st==='aktif'&&String(r.meja)===String(id)&&r.tgl>=hari()).sort(rvSort);
const rvHariIni=id=>rvMeja(id).find(r=>r.tgl===hari());
const rvN=()=>RV.filter(r=>r.st==='aktif'&&r.tgl===hari()).length;
const isLt=id=>{const m=M.find(x=>x.id==id);return !!m&&m.area.startsWith('Lantai')};
function rvRow(r,sm){return `<div class="rvr"><div><b>${r.tgl===hari()?'Hari ini':tglF(r.tgl)} · ${esc(r.jam)}</b> · ${esc(r.nama)} · ${+r.orang||0} org${sm?' · '+esc(lbl(r.meja)):''}${r.telp?`<br><small>☎ ${esc(r.telp)}</small>`:''}${r.cat?`<br><small>📝 ${esc(r.cat)}</small>`:''}</div><div class="rvbt"><button onclick="rvDatang('${r.id}')">✔ Datang</button><button class="g" onclick="rvForm('${r.meja}','${r.id}',${sm?"'list'":"''"})">✏</button><button class="r" onclick="rvBatal('${r.id}',${sm?"'list'":"''"})">✕</button></div></div>`}

function remP(o,it,idx){const a=dmOf(it),ts=Array.from({length:it.qty},(_,j)=>tmAt(o,it,j)),p=it.p||0;
 it.p=Math.max(0,p-idx.filter(j=>j<p).length);it.dm=a.filter((_,j)=>!idx.includes(j));it.ts=ts.filter((_,j)=>!idx.includes(j));it.qty-=idx.length;it.d=it.dm.filter(Boolean).length}
function hapusLocal(o,id,n,k){
 const it=o.items.find(i=>i.id==id&&(i.n||'')==(n||''));if(!it||it.kat==='diskon')return false;
 if(it.kat==='paket'){
  const cs=o.items.filter(c=>c.pkn===it.nama&&String(c.id).startsWith('p'+it.id+'_')&&(c.n||'')==(it.n||''));
  if(cs.some(c=>dmOf(c).some(Boolean)))return false;
  cs.forEach(c=>{const u=Math.round(c.qty/it.qty),idx=[];for(let j=0;j<u;j++)idx.push(c.qty-1-j);remP(o,c,idx)});
  remP(o,it,[it.qty-1])}
 else{if(it.pkn||k>=it.qty||dmOf(it)[k])return false;remP(o,it,[k])}
 const rem=o.items.filter(i=>i.id==it.id).reduce((a,i)=>a+i.qty,0);
 o.items.forEach(l=>{if(l.kat==='diskon'&&(String(l.id).startsWith('dk'+it.id+'_')||(String(l.id).startsWith('dm')&&String(l.nama).endsWith(it.nama))))l.qty=Math.min(l.qty,rem)});
 o.items=o.items.filter(i=>i.qty>0);
 if(!o.items.some(i=>i.kat!=='diskon'))o.items=[];
 return true}

function promoFor(m){const P=(CFG.promo||[]).filter(p=>p.aktif&&(p.items||[]).includes(m.id));let best=null;
 P.forEach(p=>{const d=p.tipe==='%'?Math.round(m.harga*Math.min(100,p.nilai)/100):Math.min(m.harga,Math.round(p.nilai));if(!best||d>best.d)best={d,p}});

function vsum(id,skip){return (vr[id]||[]).reduce((a,v,k)=>a+(k===skip?0:v.q),0)}
function vrUI(m){const id=m.id,c=cart[id]||0,L=vr[id]||[];if(c<2&&!L.length)return '';
 const rest=c-vsum(id);
 return `<div class="vrw">${L.map((v,k)=>`<div class="vr"><button class="g" onclick="vq(${id},${k},-1)">−</button><b>${v.q}</b><button onclick="vq(${id},${k},1)">+</button><input placeholder="Catatan khusus ${v.q} porsi ini (mis. pedas)" value="${esc(v.n)}" oninput="vr[${id}][${k}].n=this.value"><button class="r" onclick="vDel(${id},${k})">✕</button></div>`).join('')}
 ${L.length?`<small>Sisa ${rest} porsi memakai catatan di atas.</small>`:''}${rest>1||(rest>=1&&!L.length)?`<button class="vadd" onclick="vAdd(${id})">＋ Catatan berbeda untuk sebagian porsi</button>`:''}</div>`}
function vAdd(id){const c=cart[id]||0;if(vsum(id)>=c)return;(vr[id]=vr[id]||[]).push({n:'',q:1});rr()}
function vq(id,k,d){const v=vr[id][k],mx=(cart[id]||0)-vsum(id,k);v.q=Math.max(1,Math.min(mx,v.q+d));rr()}
function vDel(id,k){vr[id].splice(k,1);rr()}
function chg(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);let ex=vsum(id)-cart[id];const L=vr[id]||[];while(ex>0&&L.length){const v=L[L.length-1];if(v.q>ex){v.q-=ex;ex=0}else{ex-=v.q;L.pop()}}rr()}
function merge(o,items){items.forEach(it=>{const ex=o.items.find(i=>i.id==it.id&&(i.n||'')==(it.n||''));if(ex){const ts=Array.from({length:ex.qty},(_,k)=>tmAt(o,ex,k));for(let k=0;k<it.qty;k++)ts.push(it.t);ex.ts=ts;ex.qty+=it.qty}else o.items.push(it)})}
function markPrinted(o,list){list.forEach(x=>{const i=o.items.find(i=>i.id==x.id&&(i.n||'')==(x.n||''));if(i)i.p=Math.min(i.qty,Math.max(i.p||0,x.qty))})}
function buildItems(waktu){const items=[];
 for(const id in cart){if(!cart[id])continue;const m=MENU.find(x=>x.id==id);if(!m)continue;const n0=(notes[id]||'').trim();
  const grp=[];let sisa=cart[id];(vr[id]||[]).forEach(v=>{const q=Math.min(sisa,v.q),nn=(v.n||'').trim();if(q>0&&nn){grp.push({n:nn,q});sisa-=q}});
  if(sisa>0)grp.unshift({n:n0,q:sisa});
  grp.forEach(g=>items.push({id:+id,nama:m.nama,harga:m.harga,kat:m.kat,qty:g.q,p:0,n:g.n,t:waktu}));
  const pr=promoFor(m);if(pr)items.push({id:'dk'+m.id+'_'+pr.d,nama:(/^promo/i.test(pr.p.nama)?'':'Promo ')+pr.p.nama+': '+m.nama,harga:-pr.d,kat:'diskon',qty:cart[id],p:0,n:'',t:waktu,ex1:pr.p.eks?m.harga-pr.d:0});
  if(m.kat==='paket')grp.forEach(g=>(m.isi||[]).forEach((c,j)=>{const x=c.id!=null?MENU.find(y=>y.id==c.id):null,nm=x?x.nama:c.nama,kt=x?x.kat:c.kat;

 mdlEl().innerHTML=`<div class="mbox" style="text-align:center"><h2>${u?'📝 Tercatat (ada utang)':'✔ Pembayaran berhasil'}</h2><div style="font-size:13px;color:#555">No. Nota</div><div style="font-size:28px;font-weight:700;letter-spacing:1px">${n.no}</div>
 <div class="mrow"><span>Total</span><b>${rp(n.total)}</b></div>${n.lines.map(l=>`<div class="mrow"><span>${MI[l.metode]} ${lblL(l)}</span><span>${rp(l.jumlah)}</span></div>`).join('')}
 ${n.kembali>0?`<div class="mrow"><span>Kembalian</span><span class="kb">${rp(n.kembali)}</span></div>`:''}
 <div class="mt"><button class="g" onclick="tutupPay()">Tutup</button><button onclick="ulangNota(lastNota)">🖨 Cetak Ulang (Copy)</button></div></div>`}

/* ===== NOTA LAMA / CETAK ULANG (COPY) ===== */
let nl={q:'',dari:'',sampai:'',metode:'',L:[],msg:'',t:null};
const hariOff=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const noTgl=no=>'20'+no.substr(4,2)+'-'+no.substr(2,2)+'-'+no.substr(0,2);
function nlMatch(e){const n=e.n,no=String(e.no),q=nl.q.trim(),dg=q.replace(/\D/g,''),d=noTgl(no);
 if(nl.dari&&d<nl.dari)return false;if(nl.sampai&&d>nl.sampai)return false;
 if(nl.metode&&!n.lines.some(l=>l.metode===nl.metode))return false;
 if(q&&!(no.includes(q)||(dg&&String(Math.round(n.total))===dg)||String(n.lbl||'').toLowerCase().includes(q.toLowerCase())))return false;
 return true}
async function ulangNota(n){if(!n)return;let c;
 if(!U){const nt=J('NT',[]),e=nt.find(x=>x.no===n.no);if(!e)return alert('Nota tidak ditemukan');e.copy=(e.copy||0)+1;c=e.copy;localStorage.NT=JSON.stringify(nt)}
 else{const r=await post({action:'copy',no:n.no},true);let j=null;try{j=JSON.parse(r)}catch(e){}
  if(!j||!j.copy)return alert('Gagal mencatat cetak ulang. Pastikan internet aktif dan Code.gs terbaru sudah di-deploy.');c=j.copy}
 renderNota(n,c);if($('#nlst')){const e=nl.L.find(x=>x.n.no===n.no);if(e)e.copy=c;nlRender()}}
async function nlCari(){nl.msg='Memuat...';nlRender();const my=nl.seq=(nl.seq||0)+1;let L;
 try{if(!U)L=J('NT',[]).slice().reverse().filter(nlMatch).slice(0,500);
  else{const p=new URLSearchParams({nota:'1',q:nl.q.trim(),dari:nl.dari,sampai:nl.sampai,metode:nl.metode});
   const r=await fetch(U+(U.includes('?')?'&':'?')+p.toString());L=await r.json();if(!Array.isArray(L))throw 0}
  if(my!==nl.seq)return;nl.L=L;nl.msg=L.length?'':'Tidak ada nota yang cocok'}
 catch(e){if(my!==nl.seq)return;nl.L=[];nl.msg='Gagal memuat. Pastikan Code.gs terbaru sudah di-deploy.'}
 nlRender()}
function nlSet(a,b){nl.dari=a;nl.sampai=b;const x=$('#nld'),y=$('#nls');if(x)x.value=a;if(y)y.value=b;nlCari()}
function nlBuka(){const h=hari();nl={q:'',dari:h,sampai:h,metode:'',L:[],msg:'',t:null};
 mdlEl().innerHTML=`<div class="mbox" id="nlst" style="max-width:680px;width:96%"><h2>🧾 Daftar Nota</h2>
 <input id="nlq" placeholder="Cari no. nota, nominal (mis. 50000) atau meja" oninput="nl.q=this.value;clearTimeout(nl.t);nl.t=setTimeout(nlCari,450)" style="width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:8px;margin-bottom:6px">
 <div class="rowa" style="gap:6px;flex-wrap:wrap"><span style="font-size:13px">Dari</span><input type="date" id="nld" value="${h}" onchange="nl.dari=this.value;nlCari()" style="flex:1;min-width:130px"><span style="font-size:13px">s/d</span><input type="date" id="nls" value="${h}" onchange="nl.sampai=this.value;nlCari()" style="flex:1;min-width:130px"></div>
 <div class="rowa" style="gap:4px;flex-wrap:wrap;margin:6px 0"><button class="g" onclick="nlSet(hari(),hari())">Hari ini</button><button class="g" onclick="nlSet(hariOff(-1),hariOff(-1))">Kemarin</button><button class="g" onclick="nlSet(hariOff(-6),hari())">7 hari</button><button class="g" onclick="nlSet(hari().slice(0,8)+'01',hari())">Bulan ini</button><button class="g" onclick="nlSet('','')">Semua</button>
 <select id="nlm" onchange="nl.metode=this.value;nlCari()" style="flex:1;min-width:120px"><option value="">Semua pembayaran</option>${METODE.map(m=>`<option value="${m}">${MI[m]} ${m}</option>`).join('')}</select></div>
 <div id="nll"></div><div class="mt"><button class="g" onclick="tutupPay()">Tutup</button></div></div>`;nlCari()}
function nlRender(){const el=$('#nll');if(!el)return;
 const by={};let sum=0;nl.L.forEach(e=>{sum+=+e.n.total||0;e.n.lines.forEach(l=>by[l.metode]=(by[l.metode]||0)+l.jumlah);if(e.n.kembali>0)by['Cash']=(by['Cash']||0)-e.n.kembali});
 el.innerHTML=(nl.L.length?`<div style="background:#eef5ff;border-radius:8px;padding:6px 8px;font-size:13px;margin-bottom:4px"><b>${nl.L.length}${nl.L.length>=500?'+':''} nota · Total ${rp(sum)}</b><br>${METODE.filter(m=>by[m]).map(m=>`${MI[m]} ${m}: ${rp(by[m])}`).join(' &nbsp;·&nbsp; ')}</div>`:'')+
 `<div style="max-height:44vh;overflow:auto">${nl.msg?`<p class="leg">${nl.msg}</p>`:''}${nl.L.map((e,i)=>`<div class="rvr"><div><b>${esc(e.n.no)}</b> · ${esc(e.n.lbl)} · <b>${rp(e.n.total)}</b><br><small>${esc(e.n.waktu)} · ${[...new Set(e.n.lines.map(l=>l.metode))].map(m=>MI[m]+' '+m).join(' + ')}${e.copy?' · dicetak ulang '+e.copy+'x':''}</small></div><div class="rvbt"><button onclick="ulangNota(nl.L[${i}].n)">🖨 Copy ${(e.copy||0)+1}</button></div></div>`).join('')}</div>`}
/* ===== DISKON ===== */
let dk={};
function applyDiskon(o,dt,add,rm){
 if(rm&&rm.length)o.items=o.items.filter(i=>!rm.includes(i.id));
 (add||[]).forEach(l=>{o.items=o.items.filter(i=>i.id!==l.id);o.items.push(l)});
 if(dt===null)delete o.dt;else if(dt)o.dt=dt}
async function saveDiskon(mid,dt,add,rm){const o=O[mid];if(!o)return;
 if(!U)applyDiskon(o,dt,add,rm);
 await post({action:'diskon',meja:mid,dt,add,rm});await load(true)}
function diskonUI(back){const mid=back&&pay?pay.mid:sel,o=O[mid];if(!o||!o.items.length)return;
 dk={mid,back:!!back,tI:'%',vI:'',sel:{},tT:o.dt?o.dt.t:'%',vT:o.dt?String(o.dt.v):''};dkRender()}
function dkRender(){
 const o=O[dk.mid];if(!o)return tutupPay();
 const sub=subt(o),priced=o.items.map((i,x)=>({i,x})).filter(({i})=>i.kat!=='diskon'&&!i.pkn&&i.harga>0),ex=o.items.filter(i=>i.kat==='diskon');
 mdlEl().innerHTML=`<div class="mbox"><h2>🏷 Diskon</h2><div style="color:#555">${esc(lbl(dk.mid))}</div>
 <div class="mrow"><span>Subtotal</span><b>${rp(sub)}</b></div>
 <div class="sep"></div><b>Diskon item / promo</b><div style="font-size:12px;color:#555">Pilih item, lalu isi potongan (per porsi, untuk jumlah yang sudah dipesan).</div>
 <div style="max-height:170px;overflow:auto;margin:6px 0">${priced.map(({i,x})=>`<label class="ck"><input type="checkbox" ${dk.sel[x]?'checked':''} onchange="dk.sel[${x}]=this.checked"><span>${i.qty}x ${esc(i.nama)} <small>@${rp(i.harga)}</small></span></label>`).join('')}</div>
 <div class="rowa"><select onchange="dk.tI=this.value"><option value="%" ${dk.tI=='%'?'selected':''}>%</option><option value="Rp" ${dk.tI=='Rp'?'selected':''}>Rp</option></select><input type="text" inputmode="decimal" placeholder="Nilai diskon" value="${esc(dk.vI)}" oninput="dk.vI=this.value"><button onclick="dkItem()">Terapkan</button></div>
 <label style="font-size:13px"><input type="checkbox" ${dk.eks?'checked':''} onchange="dk.eks=this.checked"> Item ini tidak ikut diskon total</label>
 ${ex.length?`<div class="pl">${ex.map(i=>`<div class="mrow"><span style="font-size:14px">${esc(i.nama)}${i.qty>1?' ('+i.qty+'x)':''}</span><span style="color:#c0392b">-${rp(-i.harga*i.qty)} <button class="r" style="padding:1px 8px" onclick="dkRm('${i.id}')">✕</button></span></div>`).join('')}</div>`:''}
 <div class="sep"></div><b>Diskon total (seluruh pembayaran)</b>
 <div class="rowa"><select onchange="dk.tT=this.value"><option value="%" ${dk.tT=='%'?'selected':''}>%</option><option value="Rp" ${dk.tT=='Rp'?'selected':''}>Rp</option></select><input type="text" inputmode="decimal" placeholder="Nilai diskon" value="${esc(dk.vT)}" oninput="dk.vT=this.value"><button onclick="dkTotal()">Terapkan</button></div>
 <div class="mrow"><span style="font-size:14px">${o.dt?'Aktif: '+(o.dt.t==='%'?o.dt.v+'%':rp(o.dt.v))+' → -'+rp(dtd(o)):'Belum ada diskon total'}</span>${o.dt?`<button class="r" style="padding:3px 10px" onclick="dkHapusTotal()">Hapus</button>`:''}</div>
 <div class="sep"></div><div class="mrow"><b>TOTAL BAYAR</b><b style="font-size:20px">${rp(tot(o))}</b></div>
 <div class="mt"><button onclick="dkTutup()">Selesai</button></div></div>`}
async function dkItem(){const o=O[dk.mid],v=parseFloat(dk.vI);
 if(!(v>0))return alert('Isi nilai diskon');if(dk.tI==='%'&&v>100)return alert('Maksimal 100%');
 const picks=Object.keys(dk.sel).filter(k=>dk.sel[k]).map(Number);if(!picks.length)return alert('Pilih item dulu');
 const add=picks.map(x=>{const i=o.items[x];if(!i)return null;const d=dk.tI==='%'?Math.round(i.harga*v/100):Math.min(i.harga,Math.round(v));
  return d>0?{id:'dm'+Date.now()+'_'+x,nama:'Diskon '+(dk.tI==='%'?v+'% ':'')+i.nama,harga:-d,kat:'diskon',qty:i.qty,p:0,n:'',t:new Date().toISOString(),ex1:dk.eks?i.harga-d:0}:null}).filter(Boolean);
 if(!add.length)return;
 dk.sel={};dk.vI='';await saveDiskon(dk.mid,undefined,add,[]);dkRender();kas(true)}
async function dkRm(id){await saveDiskon(dk.mid,undefined,[],[id]);dkRender();kas(true)}
async function dkTotal(){const v=parseFloat(dk.vT);
 if(!(v>0))return alert('Isi nilai diskon');if(dk.tT==='%'&&v>100)return alert('Maksimal 100%');
 await saveDiskon(dk.mid,{t:dk.tT,v:dk.tT==='Rp'?Math.round(v):v},[],[]);dkRender();kas(true)}
async function dkHapusTotal(){await saveDiskon(dk.mid,null,[],[]);dk.vT='';dkRender();kas(true)}
function dkTutup(){if(dk.back&&pay)payUI();else tutupPay();kas()}

/* ===== ADMIN ===== */
function bukaAdmin(){
 const p=prompt('Masukkan PIN admin:');if(p===null)return;
 if(p!==String(CFG.pin))return alert('PIN salah');
 adm=true;atab='meja';load(true).then(()=>{MN=JSON.parse(JSON.stringify(MENU));PR=JSON.parse(JSON.stringify(CFG.promo||[]));admin()})}
function tutupAdmin(){adm=false;sel=null;app.innerHTML='';start()}
function admin(){
 const T=(k,t)=>`<button class="${atab==k?'on':''}" onclick="atab='${k}';admin()">${t}</button>`;
 let h=`<header><b>🔧 Admin</b><button onclick="tutupAdmin()">✕ Tutup</button></header><div class="adm"><div class="tabs" style="padding-left:0;padding-right:0">${T('meja','Meja')}${T('menu','Menu')}${T('promo','Promo')}${T('set','Pengaturan')}</div>`;
 if(atab=='meja'){
  h+=AREAS.map((a,i)=>`<div class="sec" style="--c:${COL[a]}"><h3>${a}</h3>${M.filter(m=>m.area==a).map(m=>`<div class="rowa"><span>${esc(m.nama)}${O[m.id]?' <small>(ada pesanan)</small>':''}</span><button class="r" ${O[m.id]?'disabled':''} onclick="admHapus('${m.id}')">🗑 Hapus</button></div>`).join('')}<div class="rowa"><input id="nm${i}" placeholder="Nama meja baru (kosong = otomatis)"><button onclick="admTambah(${i})">＋ Tambah</button></div></div>`).join('')+'<button class="g" onclick="resetMeja()">↺ Reset meja ke default</button>'}
 if(atab=='menu'){
  h+=MN.map((m,i)=>`<div class="rowa"><input value="${esc(m.nama)}" onchange="MN[${i}].nama=this.value"><input type="number" value="${m.harga}" onchange="MN[${i}].harga=+this.value"><select onchange="admKat(${i},this.value)"><option value="dapur" ${m.kat=='dapur'?'selected':''}>Makanan</option><option value="bar" ${m.kat=='bar'?'selected':''}>Minuman</option><option value="paket" ${m.kat=='paket'?'selected':''}>Paket</option></select><button class="r" onclick="MN.splice(${i},1);admin()">🗑</button></div>${m.kat=='paket'?paketEd(i):''}`).join('')+'<div class="rowa"><button class="g" onclick="admMenuTambah()">＋ Tambah menu</button><button onclick="admMenuSimpan()">💾 Simpan menu</button></div><p class="leg" style="padding:0">Perubahan menu baru berlaku setelah klik Simpan. Pesanan yang sudah masuk tidak berubah. Paket: pilih kategori Paket, lalu isi dengan menu makanan/minuman.</p>'}
 if(atab=='promo'){
  h+='<p class="leg" style="padding:0 0 6px">Promo yang <b>aktif</b> otomatis memotong harga item yang dipilih setiap kali item itu dipesan (potongan per porsi). Pesanan yang sudah masuk tidak berubah.</p>'
   +PR.map((p,i)=>`<div class="sec" style="--c:#c0392b"><div class="rowa"><input placeholder="Nama promo (mis. Promo Weekend)" value="${esc(p.nama)}" onchange="PR[${i}].nama=this.value"><select onchange="PR[${i}].tipe=this.value"><option value="%" ${p.tipe=='%'?'selected':''}>%</option><option value="Rp" ${p.tipe=='Rp'?'selected':''}>Rp</option></select><input type="number" min="0" value="${p.nilai}" onchange="PR[${i}].nilai=+this.value"></div>
    <div class="rowa"><label><input type="checkbox" ${p.aktif?'checked':''} onchange="PR[${i}].aktif=this.checked"> Aktif</label><label><input type="checkbox" ${p.eks?'checked':''} onchange="PR[${i}].eks=this.checked"> Tidak ikut diskon total</label><button class="r" onclick="PR.splice(${i},1);admin()">🗑 Hapus promo</button></div>
    <small>Item yang kena promo:</small><div class="pgrid">${MENU.map(m=>`<label><input type="checkbox" ${(p.items||[]).includes(m.id)?'checked':''} onchange="admPI(${i},${m.id},this.checked)"> ${esc(m.nama)}</label>`).join('')}</div></div>`).join('')
   +'<div class="rowa"><button class="g" onclick="admPromoTambah()">＋ Tambah promo</button><button onclick="admPromoSimpan()">💾 Simpan promo</button></div>'}
 if(atab=='set'){
  h+=`<label class="fld">Nama restoran</label><input id="cn" value="${esc(CFG.resto)}"><label class="fld">Alamat (tampil di nota)</label><input id="ca" value="${esc(CFG.alamat)}"><label class="fld">PIN admin</label><input id="cp" value="${esc(CFG.pin)}"><div class="rowa" style="margin-top:14px"><button onclick="admSet()">💾 Simpan pengaturan</button></div>`}
 app.innerHTML=h+'</div>'}
function admPromoTambah(){PR.push({id:Date.now(),nama:'',tipe:'%',nilai:10,aktif:true,items:[]});admin()}
function admPI(i,id,on){const a=PR[i].items||(PR[i].items=[]),k=a.indexOf(id);if(on&&k<0)a.push(id);if(!on&&k>=0)a.splice(k,1)}
async function admPromoSimpan(){
 for(const p of PR){if(!String(p.nama).trim())return alert('Nama promo tidak boleh kosong');
  if(!(+p.nilai>0))return alert('Nilai promo "'+p.nama+'" harus lebih dari 0');
  if(p.tipe=='%'&&+p.nilai>100)return alert('Promo "'+p.nama+'" maksimal 100%');
  if(!(p.items||[]).length)return alert('Pilih minimal satu item untuk promo "'+p.nama+'"')}
 CFG={...CFG,promo:JSON.parse(JSON.stringify(PR)).map(p=>({...p,nama:String(p.nama).trim(),nilai:+p.nilai}))};
 await post({action:'cfg',cfg:CFG});alert('Promo tersimpan ✔');admin()}
async function admTambah(i){
 const a=AREAS[i],s=M.filter(m=>m.area==a);let n=($('#nm'+i).value||'').trim();
 if(!n)n=a.startsWith('Lantai')?''+(Math.max(0,...s.map(m=>parseInt(m.nama)||0))+1):a+' '+(s.length+1);
 M.push({id:'m'+Date.now(),area:a,nama:n});await post({action:'meja',list:M});admin()}
async function admHapus(id){
 if(!confirm('Hapus '+lbl(id)+'?'))return;
 M=M.filter(m=>m.id!=id);await post({action:'meja',list:M});admin()}
async function resetMeja(){
 if(Object.keys(O).some(id=>!DEF.find(m=>m.id==id)))return alert('Masih ada pesanan aktif di meja tambahan. Bayar dulu, baru reset.');
 if(!confirm('Kembalikan daftar meja ke default? Meja tambahan akan dihapus.'))return;
 M=DEF.map(m=>({...m}));await post({action:'meja',list:M});admin()}
function admKat(i,v){MN[i].kat=v;if(v=='paket'){if(!MN[i].isi)MN[i].isi=[]}else delete MN[i].isi;admin()}
function admIsi(i,custom){const f=MN.find(x=>x.kat!=='paket');
 if(!custom&&!f)return alert('Belum ada menu makanan/minuman. Pakai "＋ Custom" atau buat menunya dulu.');
 (MN[i].isi=MN[i].isi||[]).push(custom?{nama:'',kat:'dapur',qty:1}:{id:f.id,qty:1});admin()}
function paketEd(i){const m=MN[i],opts=MN.filter(x=>x.kat!=='paket');
 const rows=(m.isi||[]).map((c,j)=>{
  const q=`<input type="number" style="width:60px" min="1" value="${c.qty}" onchange="MN[${i}].isi[${j}].qty=Math.max(1,+this.value||1)">`,del=`<button class="r" onclick="MN[${i}].isi.splice(${j},1);admin()">✕</button>`;
  if(c.id==null)return `<div class="rowa">${q}<input placeholder="Nama item custom (mis. Nasi putih)" value="${esc(c.nama||'')}" onchange="MN[${i}].isi[${j}].nama=this.value"><select onchange="MN[${i}].isi[${j}].kat=this.value"><option value="dapur" ${c.kat=='dapur'?'selected':''}>Makanan</option><option value="bar" ${c.kat=='bar'?'selected':''}>Minuman</option></select>${del}</div>`;
  return `<div class="rowa">${q}<select style="flex:1" onchange="MN[${i}].isi[${j}].id=+this.value">${opts.map(x=>`<option value="${x.id}" ${x.id==c.id?'selected':''}>${esc(x.nama)} (${x.kat=='bar'?'minuman':'makanan'})</option>`).join('')}</select>${del}</div>`}).join('');
 return `<div style="margin:-2px 0 10px 14px;padding:8px;border-left:3px solid #d98324;background:#fff8ec;border-radius:8px"><small><b>Isi paket:</b> pilih dari menu yang ada, atau tambah item custom (Makanan dicetak ke dapur, Minuman ke bartender)</small>${rows}<div class="rowa"><button class="g" style="padding:6px 10px;font-size:13px" onclick="admIsi(${i})">＋ Dari menu</button><button class="g" style="padding:6px 10px;font-size:13px" onclick="admIsi(${i},true)">＋ Custom</button></div></div>`}
function admMenuTambah(){MN.push({id:Math.max(0,...MN.map(m=>m.id),...MENU.map(m=>m.id))+1,nama:'Menu baru',harga:0,kat:'dapur'});admin()}
async function admMenuSimpan(){
 if(MN.some(m=>!String(m.nama).trim()))return alert('Nama menu tidak boleh kosong');
 if(!MN.length)return alert('Menu tidak boleh kosong');
 for(const m of MN.filter(x=>x.kat=='paket')){if(!(m.isi||[]).length)return alert('Paket "'+m.nama+'" belum ada isinya');
  for(const c of m.isi){if(c.id==null){if(!String(c.nama||'').trim())return alert('Ada item custom di paket "'+m.nama+'" yang namanya masih kosong.');continue}
   const x=MN.find(y=>y.id==c.id);if(!x||x.kat=='paket')return alert('Isi paket "'+m.nama+'" memuat menu yang sudah dihapus atau diubah jadi paket. Perbaiki dulu.')}}
 MENU=JSON.parse(JSON.stringify(MN)).map(m=>({...m,nama:String(m.nama).trim(),harga:+m.harga||0}));
 MENU.forEach(m=>{if(m.isi)m.isi.forEach(c=>{if(c.id==null)c.nama=String(c.nama).trim()})});await post({action:'menu',list:MENU});alert('Menu tersimpan ✔');admin()}
async function admSet(){
 CFG={...CFG,resto:$('#cn').value.trim()||DEFCFG.resto,alamat:$('#ca').value.trim(),pin:$('#cp').value.trim()||'1234'};
 await post({action:'cfg',cfg:CFG});alert('Pengaturan tersimpan ✔');admin()}
start();
</script></body></html>
